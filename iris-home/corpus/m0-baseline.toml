# 评测基线：expect_web 声明该条目是否参与 Web 可达率，None（缺省）表示不参与。
# 分母 = 声明了 expect_web 且被实测的条目；未实测条目计入 skipped，不进任何分母。
# expectation_note 记录该期望的来源实测，避免下次凭记忆改结论。
# IRIS M0 baseline corpus: 10 firmware entries for pipeline validation.
# status=confirmed  -> URL verified / high confidence; download directly.
# status=pending    -> URL may rotate; browse the vendor portal to fix before download.
# If a URL 404s, browse the parent directory (e.g. downloads.openwrt.org/releases/)
# and adjust the filename; keep the entry so coverage accounting stays intact.

name = "m0-baseline"
description = "M0 tech validation: 10 entries covering mipseb/mipsel/armel/x64 + camera slot"

[[entries]]
name = "dlink-dir868l-revb"
brand = "D-Link"
product = "DIR-868L"
version = "revB_2.05b02"
url = "https://github.com/pr0v3rbs/FirmAE/releases/download/v1.0/DIR-868L_fw_revB_2-05b02_eu_multi_20161117.zip"
status = "confirmed"
source = "FirmAE release page"
notes = "Official FirmAE README sample; auto-routed through IRIS_ mirror for github"
expect_web = true
timeout_sec = 300
expectation_note = "0.3.12 实测 HTTP 200 @53.0s；此前两次结论（VLAN 路由不通 / 宿主不在 guest 子网）均已被推翻"
db_match = "DIR-868L_fw_revB_2-05b02"

