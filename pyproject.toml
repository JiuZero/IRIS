[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris"
version = "0.3.3"
description = "IRIS - IoT Rehosting & Interconnection Simulator (网络设备固件仿真平台)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.12",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.8", "httpx>=0.27"]

[project.scripts]
iris = "iris.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# B008: function calls in argument defaults are typer's standard pattern
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]# src-layout: 默认的 prepend 导入模式会把仓库根目录塞进 sys.path[0]，而根目录
# 有调试入口 iris.py——它会抢在 src/iris 之前被 `import iris` 命中。importlib
# 模式不做路径注入，src 由 pythonpath 显式提供，两者不再互相干扰。
addopts = "--import-mode=importlib"
pythonpath = ["src"]
