id: generic-watchdog-guard
description: >
  Universal guard against vendor supervision daemons that trigger system reboots.
  This rule engine pattern matches any daemon named with common keywords (monitor, watchdog, keepalive)
  regardless of its exact location or how it's spawned (inittab, rc scripts, getty, etc.).
  
  Pattern detection covers:
  - Direct inittab entries (::once/-/bin/monitor, ::respawn/-/sbin/watchdog)
  - Symbolic links (/bin/monitor -> ../opt/monitor where target is disabled)
  - Alternative spawning methods (console login, profile scripts, cron jobs)
  - Multiple variants (monitor, monitord, watchdog, keepalive, wdt, keep_alive)
  
  Actions ensure binaries are removed/rename AND symlinks are deleted to prevent
  broken exec attempts that cause resource contention.
stage: service
detect:
  # Pattern 1: inittab spawn patterns
  - file_regex: '::(once|respawn|restart):[^\n]*/(monitor|watchdog|keep_alive|keepalive|wdt|reboot_guard)(\s|$)'
    within: 'etc/inittab'
    
  # Pattern 2: Binary existence heuristic (if binary exists with monitor/watchdog name)
  - file_pattern: '**/(monitor|watchdog|keep_alive)[^/]*/$'
    condition: executable
    
actions:
  # Remove symbolic links first (prevent broken exec attempts)
  - guest_shell: |
      echo "# IRIS-Generic Watchdog Guard: Removing supervisor daemons"
      
      # Phase 1: Remove all monitor-related symlinks FIRST
      echo "Phase 1: Disabling symbolic links..."
      for link_type in bin sbin usr/bin usr/sbin opt/opt/bin; do
        if [ -d "/$link_type" ]; then
          find /$link_type -maxdepth 1 -type l \( -name "*monitor*" -o -name "*watchdog*" -o -name "*keep*alive*" -o -name "*wdt*" \) -exec rm -f {} \; 2>/dev/null
        fi
      done
      
      # Phase 2: Rename remaining binaries to .iris-disabled
      echo "Phase 2: Renaming binaries..."
      for b in /bin/monitor /sbin/monitor /usr/bin/monitor /usr/sbin/monitor \
              /opt/monitor /opt/bin/monitor /bin/watchdog /sbin/watchdog \
              /usr/bin/watchdog /usr/sbin/watchdog /etc/scripts/watchdog \
              /bin/monitord /bin/arp_monitor /bin/ppp-monitor \
              /sbin/keep_alive /usr/bin/keepalive /bin/wdt; do
        if [ -L "$b" ]; then 
          echo "  Removing symlink: $b"
          rm -f "$b" 2>/dev/null
        elif [ -e "$b" ] && [ -x "$b" ]; then 
          echo "  Renaming binary: $b → ${b}.iris-disabled"
          mv -f "$b" "${b}.iris-disabled" 2>/dev/null || true
        elif [ -e "$b" ]; then
          echo "  Deleting non-executable: $b"
          rm -f "$b" 2>/dev/null || true
        fi
      done
      
      # Phase 3: Clean up any console/auto-login mechanisms
      echo "Phase 3: Cleaning up console triggers..."
      if [ -f "/etc/inittab" ]; then
        sed -i '/::.*\(monitor\|watchdog\|keep_alive\)/{s/^/#IRIS-AUTO-GUARD: /}' /etc/inittab 2>/dev/null || true
      fi
      
      echo "Generic watchdog guard complete."
      
  # Phase 4: Additional cleanup for process monitors
  - guest_shell: |
      echo "# IRIS-Process Monitor Cleanup"
      
      # Disable diagnostic tools (can cause SIG11 crashes blocking web server)
      for d in /bin/diag /usr/bin/diag /sbin/diag; do
        if [ -L "$d" ]; then rm -f "$d";
        elif [ -x "$d" ]; then mv -f "$d" "${d}.iris-disabled";
        fi
      done
      
      # Block reboot mechanisms entirely
      if [ -x /sbin/reboot ]; then mv -f /sbin/reboot /sbin/reboot.iris-disabled 2>/dev/null || true; fi
      if [ -x /bin/reboot ]; then mv -f /bin/reboot /bin/reboot.iris-disabled 2>/dev/null || true; fi
      
      # Disable sysrq triggers (prevent hard resets)
      echo 0 > /proc/sys/kernel/sysrq 2>/dev/null || true
      
      echo "Process monitor cleanup complete."

# Evidence collection for debugging
post_action_verify:
  check_files:
    - path: /bin/monitor.iris-disabled
      expected: "may exist as renamed backup"
    - path: /opt/monitor.iris-disabled
      expected: "may exist as renamed backup"
    - path: /sbin/reboot.iris-disabled
      expected: "may exist as renamed backup"
  
  forbidden_patterns:
    - pattern: "::(once|respawn).*monitor"
      in_file: /etc/inittab
      action_if_found: report_error
      
  health_check:
    command: "ps aux | grep -v grep | grep -E 'monitor|watchdog' | grep -v iris-disabled"
    expected_exit_code: 1  # No active monitor processes allowed
