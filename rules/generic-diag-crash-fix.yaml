id: generic-diag-crash-fix
description: >
  Disable diagnostic tools that crash with SIGSEGV (signal 11) and loop indefinitely,
  consuming CPU resources and preventing other services from starting. Evidence: TES7002
  firmware shows 'diag: potentially unexpected fatal signal 11' repeated thousands of times,
  blocking boot sequence completion and web server initialization. The diag binary runs
  continuously during init and crashes on invalid memory access patterns not present in
  real hardware.
stage: service
detect:
  - file_regex: '^#!.*[Ss]h|/bin/sh.*#.*IRIS'
    within: 'etc/init.d/rcS'
actions:
  - guest_shell: |
      # Phase 1: Rename all diagnostic binaries to prevent their execution
      for diag_binary in /bin/diag /usr/bin/diag /sbin/diag; do
        if [ -f "$diag_binary" ] || [ -L "$diag_binary" ]; then
          echo "  Disabling diagnostic tool: $diag_binary"
          if [ -L "$diag_binary" ]; then
            rm -f "$diag_binary" 2>/dev/null
          else
            mv -f "$diag_binary" "${diag_binary}.iris-disabled" 2>/dev/null || true
          fi
        fi
      done
      
      # Phase 2: Remove any cron jobs or init scripts that might trigger diag
      find /etc/init.d -name "*diag*" -delete 2>/dev/null || true
      find /etc/cron.* -type f -exec grep -l "diag" {} \; -delete 2>/dev/null || true
      
      # Evidence collection
      echo "#IRIS-diag-fixed:" >> /etc/scripts/boot_fixes.log
      echo "Diagnostic tools disabled to prevent SIGSEGV loops and allow web server startup." >> /etc/scripts/boot_fixes.log
